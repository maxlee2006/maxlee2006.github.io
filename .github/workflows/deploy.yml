name: Deploy to GitHub Pages

# Pushes to main publish the live website. A feature-branch push only saves code;
# it does not run this deployment. Database content edits need neither kind of push.
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # A GitHub deployment environment groups settings/approval rules. It is
    # unrelated to .env.local on a developer's computer or a Supabase project.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint and test
        run: npm run lint && npm test

      # Public configuration is embedded into exported JavaScript at build time.
      # vars reads GitHub Actions Variables; github-pages environment values can
      # override repository values. Neither value should be an owner/service key.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "Set NEXT_PUBLIC_SUPABASE_URL in repository Actions variables"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "Set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in repository Actions variables"; exit 1; }
          # Read the live API first; stop on failure before building/publishing.
          # This command never applies migrations or imports the seed.
          npm run cms:check
          npm run build
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

